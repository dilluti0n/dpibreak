name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --locked
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch WinDivert
        shell: pwsh
        run: ./scripts/fetch-windivert.ps1
      - name: build
        run: cargo build --locked
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        shell: pwsh
        run: |
          # test binaries link WinDivert.dll dynamically
          $env:PATH = "$env:GITHUB_WORKSPACE\WinDivert-2.2.2-A\x64;$env:PATH"
          cargo test --locked

  dist:
    uses: ./.github/workflows/dist.yml
